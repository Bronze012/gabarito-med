name: Gabaritos automáticos

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gabaritos
  cancel-in-progress: false

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: python -m pip install --upgrade pip requests pymupdf
      - name: Conferir as bancas
        run: python robo_gabaritos/robo/robo.py
      - name: Publicar se mudou
        run: |
          git config user.name  "robo-gabaritos"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robo_gabaritos/docs/gabaritos.json
          if git diff --cached --quiet; then
            echo "Nada novo."
          else
            git commit -m "gabaritos: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash || true
            git push
          fi
